[project]
name = "ai-portfolio-agent-api"
version = "0.1.0"
description = "FastAPI + LangGraph backend for ai-portfolio-agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "python-dotenv>=1.0",
  "pyjwt[crypto]>=2.8",
  "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
